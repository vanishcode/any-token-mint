    <noscript>
      <h1>Mint any ERC20 token on any EVM testnet</h1>
      <p>
        <strong>Any Token Mint</strong> is a free, wallet-connected dApp for minting any ERC20
        token on any EVM testnet — Sepolia, Holesky, Base Sepolia, Arbitrum Sepolia, Optimism
        Sepolia, Polygon Amoy, zkSync Sepolia, Linea Sepolia, Scroll Sepolia, Mantle Sepolia,
        Blast Sepolia, BNB testnet, Avalanche Fuji and any other chain exported by
        <code>wagmi/chains</code>.
      </p>
      <p>
        Connect a wallet with RainbowKit (MetaMask, Rainbow, WalletConnect, Coinbase Wallet),
        paste the token contract address, enter the amount and the recipient — the app reads
        <code>decimals()</code>, simulates the <code>mint(address,uint256)</code> call so revert
        reasons surface before signing, then submits the transaction and waits for confirmation.
      </p>

      <h2>Supported testnets</h2>
      <ul>
        <li>Ethereum Sepolia, Holesky</li>
        <li>Base Sepolia</li>
        <li>Arbitrum Sepolia</li>
        <li>Optimism Sepolia</li>
        <li>Polygon Amoy</li>
        <li>zkSync Sepolia</li>
        <li>Linea Sepolia</li>
        <li>Scroll Sepolia</li>
        <li>Mantle Sepolia</li>
        <li>Blast Sepolia</li>
        <li>BNB Smart Chain testnet</li>
        <li>Avalanche Fuji</li>
        <li>…and every other chain in <code>wagmi/chains</code> (mainnets too, if a token grants you the minter role)</li>
      </ul>

      <h2>FAQ</h2>
      <h3>What does this dApp do?</h3>
      <p>
        It calls <code>mint(address to, uint256 amount)</code> on an ERC20 contract you specify,
        on whatever chain your wallet is currently connected to. It is meant as a quick way to
        mint test tokens you control on testnets without writing a custom script.
      </p>

      <h3>Which testnets are supported?</h3>
      <p>
        Every chain exported by <code>wagmi/chains</code>. The chain in use is whatever your
        wallet is currently switched to — there is no in-app network selector.
      </p>

      <h3>Do I need testnet ETH?</h3>
      <p>
        Yes. Minting is a real on-chain transaction so you need a small amount of the testnet's
        native gas token. Use the chain's official faucet (for example
        <em>sepoliafaucet.com</em>, <em>holesky.ethpandaops.io</em>, the Base / Arbitrum / Optimism
        Superchain faucet, or the Polygon Amoy faucet).
      </p>

      <h3>Will it work for any ERC20?</h3>
      <p>
        Only ERC20 contracts that (1) expose the standard <code>mint(address,uint256)</code>
        signature and (2) grant your connected wallet permission to call it. The dApp runs
        <code>useSimulateContract</code> first, so you'll see the revert reason ("caller is not
        the minter", "function does not exist") before any gas is spent.
      </p>

      <p>This application requires JavaScript to run.</p>
